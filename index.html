<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A fast keyboard exercise for learning to read notes in treble and bass clef.">
  <title>NoteType</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1d1f'/%3E%3Cpath d='M41 12v31.5a10 10 0 1 1-5-8.7V17l-18 4v28.5a10 10 0 1 1-5-8.7V17z' fill='%23e8b44c'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #202224;
      --panel: #282b2e;
      --panel-soft: #242628;
      --ink: #e8e7e2;
      --muted: #8e9296;
      --faint: #505458;
      --accent: #e8b44c;
      --accent-soft: rgba(232, 180, 76, .14);
      --error: #e86b62;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% -10%, rgba(232, 180, 76, .065), transparent 34rem),
        var(--bg);
      color: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .app {
      width: min(980px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 32px 0 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 750;
      letter-spacing: -.035em;
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      color: var(--accent);
    }

    .round-label {
      color: var(--muted);
      font-size: .84rem;
    }

    main {
      align-self: center;
      padding: 64px 0 48px;
    }

    .game-shell {
      max-width: 760px;
      margin: 0 auto;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin-bottom: 26px;
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .option-label {
      margin-right: 3px;
      color: var(--muted);
      font-size: .78rem;
    }

    .option-button {
      appearance: none;
      min-height: 35px;
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--muted);
      cursor: pointer;
      font-size: .78rem;
      transition: color .14s ease, border-color .14s ease, background .14s ease;
    }

    .option-button:hover { color: var(--ink); }

    .option-button.active {
      border-color: rgba(232,180,76,.48);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .option-button:disabled {
      cursor: default;
      opacity: .68;
    }

    .note-option {
      min-width: 35px;
      padding-inline: 9px;
      text-transform: uppercase;
    }

    .range-option {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .option-button:focus-visible {
      outline: 3px solid rgba(232,180,76,.28);
      outline-offset: 2px;
    }

    .row-stepper {
      display: flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .stepper-button {
      appearance: none;
      width: 34px;
      min-height: 33px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
    }

    .stepper-button:hover { color: var(--accent); background: var(--accent-soft); }
    .stepper-button:disabled { color: var(--faint); cursor: default; background: transparent; }
    .stepper-button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .row-count {
      min-width: 34px;
      color: var(--ink);
      font-size: .82rem;
      text-align: center;
    }

    .hud {
      min-height: 31px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 16px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: .86rem;
    }

    .hud strong {
      color: var(--accent);
      font-size: 1.55rem;
      font-weight: 550;
      line-height: 1;
    }

    .timer { text-align: center; }
    .errors { text-align: right; }

    .stage {
      position: relative;
      overflow: hidden;
      min-height: 380px;
      display: grid;
      place-items: center;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.055);
      border-radius: var(--radius);
      box-shadow: 0 22px 70px rgba(0,0,0,.19);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--accent) var(--progress), transparent var(--progress));
      transition: background .18s ease;
    }

    .practice-view {
      width: 100%;
      padding: 34px 42px 32px;
      text-align: center;
    }

    .note-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      min-height: 316px;
    }

    .score-row {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 150px;
      padding: 6px 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.055);
      border-radius: 13px;
      background: var(--panel-soft);
      transition: border-color .16s ease, background .16s ease;
    }

    .score-row svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .score-row.active {
      border-color: rgba(232,180,76,.72);
      background: rgba(232,180,76,.055);
      box-shadow: inset 0 0 0 1px rgba(232,180,76,.12);
    }

    .prompt {
      min-height: 24px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .prompt.error {
      color: var(--error);
      animation: nudge .18s ease-in-out;
    }

    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      35% { transform: translateX(-5px); }
      70% { transform: translateX(5px); }
    }

    .sequence {
      display: flex;
      gap: 4px;
      margin-top: 24px;
    }

    .step {
      flex: 1 1 0;
      min-width: 2px;
      height: 5px;
      border-radius: 999px;
      background: var(--faint);
      transition: background .18s ease, transform .18s ease;
    }

    .step.done { background: var(--accent); }
    .step.current { background: var(--ink); transform: scaleY(1.6); }

    .key-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .key {
      min-width: 38px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.075);
      border-bottom-width: 3px;
      border-radius: 8px;
      color: #b9bcbe;
      background: var(--panel-soft);
      font-size: .83rem;
      text-transform: uppercase;
      transition: color .12s ease, border-color .12s ease, transform .12s ease;
    }

    .key.pressed {
      color: var(--accent);
      border-color: rgba(232,180,76,.45);
      transform: translateY(2px);
    }

    .result-view {
      display: none;
      width: 100%;
      padding: 42px 48px;
    }

    .result-view h1 {
      margin: 0 0 34px;
      color: var(--accent);
      font-size: clamp(1.55rem, 4vw, 2.35rem);
      font-weight: 600;
      letter-spacing: -.05em;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .stat {
      padding: 18px;
      background: var(--panel-soft);
      border-radius: 12px;
    }

    .stat span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .78rem;
    }

    .stat strong {
      color: var(--ink);
      font-size: clamp(1.45rem, 4vw, 2.15rem);
      font-weight: 520;
    }

    .restart {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 12px 17px;
      background: var(--accent);
      color: #24211a;
      cursor: pointer;
      font-weight: 750;
      transition: filter .15s ease, transform .15s ease;
    }

    .restart:hover { filter: brightness(1.08); }
    .restart:active { transform: translateY(1px); }
    .restart:focus-visible { outline: 3px solid rgba(232,180,76,.35); outline-offset: 3px; }

    footer {
      display: flex;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: .78rem;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid var(--faint);
      border-radius: 5px;
      color: #b9bcbe;
      background: var(--panel-soft);
      font-family: inherit;
      font-size: .75rem;
    }

    .flash-correct { animation: flash-correct .2s ease; }
    .flash-wrong { animation: flash-wrong .25s ease; }

    @keyframes flash-correct {
      50% { background: rgba(119,197,138,.13); }
    }

    @keyframes flash-wrong {
      45% { background: rgba(232,107,98,.13); }
    }

    @media (max-width: 620px) {
      .app { width: min(100% - 24px, 980px); padding-top: 20px; }
      main { padding: 38px 0 28px; }
      .options { align-items: flex-start; gap: 12px; margin-bottom: 20px; }
      .option-group { flex-wrap: wrap; justify-content: center; }
      .sequence { gap: 1px; }
      .step { min-width: 1px; }
      .stage { min-height: 350px; }
      .practice-view, .result-view { padding: 30px 20px; }
      .note-grid { gap: 8px; min-height: 246px; }
      .score-row { min-height: 118px; padding: 3px; border-radius: 10px; }
      .hud { grid-template-columns: 1fr 1fr; }
      .timer { text-align: left; }
      .errors { text-align: right; }
      .progress-count { grid-column: 1 / -1; grid-row: 1; text-align: center; }
      .results { grid-template-columns: 1fr; }
      .stat { display: flex; align-items: center; justify-content: space-between; }
      .stat span { margin: 0; }
      .result-view h1 { margin-bottom: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

  <div class="app">
    <header>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M43 8v35.5a10.5 10.5 0 1 1-5-8.9V16.5l-20 4.4v28.6a10.5 10.5 0 1 1-5-8.9V17z" fill="currentColor"/>
        </svg>
        <span>notetype</span>
      </div>
      <div class="round-label" id="roundLabel" aria-live="polite"></div>
    </header>

    <main>
      <div class="game-shell">
        <div class="options" aria-label="Practice settings">
          <div class="option-group" role="group" aria-label="Choose clef">
            <span class="option-label">clef</span>
            <button class="option-button" type="button" data-setting="clef" data-value="treble">G</button>
            <button class="option-button" type="button" data-setting="clef" data-value="bass">F</button>
            <button class="option-button" type="button" data-setting="clef" data-value="both">G + F</button>
          </div>
          <div class="option-group" role="group" aria-label="Choose pitch range">
            <span class="option-label">range</span>
            <button class="option-button range-option" type="button" data-setting="range" data-value="lower">C4–B4</button>
            <button class="option-button range-option" type="button" data-setting="range" data-value="upper">C5–B5</button>
            <button class="option-button range-option" type="button" data-setting="range" data-value="both">C4–B5</button>
          </div>
          <div class="option-group" role="group" aria-label="Choose notes">
            <span class="option-label">notes</span>
            <button class="option-button note-option" type="button" data-note="c">C</button>
            <button class="option-button note-option" type="button" data-note="d">D</button>
            <button class="option-button note-option" type="button" data-note="e">E</button>
            <button class="option-button note-option" type="button" data-note="f">F</button>
            <button class="option-button note-option" type="button" data-note="g">G</button>
            <button class="option-button note-option" type="button" data-note="a">A</button>
            <button class="option-button note-option" type="button" data-note="b">B</button>
          </div>
          <div class="option-group" role="group" aria-label="Choose number of rows">
            <span class="option-label">rows</span>
            <div class="row-stepper">
              <button class="stepper-button" id="rowDecrease" type="button" aria-label="Fewer rows">−</button>
              <output class="row-count" id="rowCount" aria-live="polite">2</output>
              <button class="stepper-button" id="rowIncrease" type="button" aria-label="More rows">+</button>
            </div>
          </div>
        </div>

        <div class="hud">
          <div class="timer"><strong id="time">0.00</strong> s</div>
          <div class="progress-count"><span id="position">1</span> / <span id="roundLength">16</span></div>
          <div class="errors"><span id="errorCount">0</span> errors</div>
        </div>

        <section class="stage" id="stage" style="--progress: 0%" aria-label="Note-reading practice">
          <div class="practice-view" id="practiceView">
            <div class="note-grid" id="noteGrid" aria-label="Two staves with two measures each"></div>
            <p class="prompt" id="prompt" role="status" aria-live="polite">Press the letter that matches the note</p>

            <div class="sequence" id="sequence" aria-label="Round progress"></div>
            <div class="key-row" aria-hidden="true">
              <span class="key" data-key="a">a</span><span class="key" data-key="b">b</span>
              <span class="key" data-key="c">c</span><span class="key" data-key="d">d</span>
              <span class="key" data-key="e">e</span><span class="key" data-key="f">f</span>
              <span class="key" data-key="g">g</span>
            </div>
          </div>

          <div class="result-view" id="resultView" aria-live="polite">
            <h1>Round complete.</h1>
            <div class="results">
              <div class="stat"><span>time</span><strong id="finalTime">0.00 s</strong></div>
              <div class="stat"><span>accuracy</span><strong id="accuracy">100%</strong></div>
              <div class="stat"><span>errors</span><strong id="finalErrors">0</strong></div>
            </div>
            <button class="restart" id="restartButton" type="button">New round</button>
          </div>
        </section>
      </div>
    </main>

    <footer><kbd>tab</kbd><span>restart</span></footer>
  </div>

  <script>
    (() => {
      "use strict";

      const NOTE_NAMES = ["c", "d", "e", "f", "g", "a", "b"];
      const RANGE_LABELS = {
        treble: { lower: "C4–B4", upper: "C5–B5", both: "C4–B5" },
        bass: { lower: "C2–B2", upper: "C3–B3", both: "C2–B3" },
        both: {
          lower: "G: C4–B4 / F: C2–B2",
          upper: "G: C5–B5 / F: C3–B3",
          both: "G: C4–B5 / F: C2–B3"
        }
      };
      const ROW_SIZE = 8;
      const PAGE_SIZE = ROW_SIZE * 2;
      const MAX_ROWS = 16;
      const stage = document.getElementById("stage");
      const practiceView = document.getElementById("practiceView");
      const resultView = document.getElementById("resultView");
      const prompt = document.getElementById("prompt");
      const noteGrid = document.getElementById("noteGrid");
      const timeElement = document.getElementById("time");
      const positionElement = document.getElementById("position");
      const errorElement = document.getElementById("errorCount");
      const sequenceElement = document.getElementById("sequence");
      const roundLabel = document.getElementById("roundLabel");
      const roundLengthElement = document.getElementById("roundLength");
      const rowCountElement = document.getElementById("rowCount");
      const rowDecreaseButton = document.getElementById("rowDecrease");
      const rowIncreaseButton = document.getElementById("rowIncrease");
      const restartButton = document.getElementById("restartButton");
      const finalTimeElement = document.getElementById("finalTime");
      const accuracyElement = document.getElementById("accuracy");
      const finalErrorsElement = document.getElementById("finalErrors");

      let round = [];
      const settings = { clef: "treble", range: "lower", rows: 2, notes: [...NOTE_NAMES] };
      let currentIndex = 0;
      let errors = 0;
      let attempts = 0;
      let startTime = null;
      let timerFrame = null;
      let transitionTimer = null;
      let finished = false;
      let inputLocked = false;

      function getRoundLength() {
        return settings.rows * ROW_SIZE;
      }

      function shuffle(values) {
        const result = [...values];
        for (let i = result.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function balancedBag(values, total, runningTotals = null) {
        const bag = [];
        const baseCount = Math.floor(total / values.length);
        const remainder = total % values.length;

        values.forEach(value => {
          for (let i = 0; i < baseCount; i += 1) bag.push(value);
          if (runningTotals) runningTotals[value] += baseCount;
        });

        const extraOrder = shuffle(values).sort((a, b) => {
          if (!runningTotals) return 0;
          return runningTotals[a] - runningTotals[b];
        });
        extraOrder.slice(0, remainder).forEach(value => {
          bag.push(value);
          if (runningTotals) runningTotals[value] += 1;
        });

        return shuffle(bag);
      }

      function makeRound() {
        const items = [];
        let lastKey = "";
        const allowedClefs = settings.clef === "both" ? ["treble", "bass"] : [settings.clef];
        const allowedRanges = settings.range === "both" ? [0, 1] : [settings.range === "lower" ? 0 : 1];
        const rangeStart = {
          treble: [-2, 5], // C–B below/inside G-clef, then C–B above it
          bass: [-4, 3]    // C–B below/inside F-clef, then C–B above it
        };
        const rowClefs = balancedBag(allowedClefs, settings.rows);
        const noteTotals = Object.fromEntries(settings.notes.map(note => [note, 0]));
        const noteBags = {};
        const rangeBags = {};

        allowedClefs.forEach(clefType => {
          const notesForClef = rowClefs.filter(rowClef => rowClef === clefType).length * ROW_SIZE;
          noteBags[clefType] = balancedBag(settings.notes, notesForClef, noteTotals);
          rangeBags[clefType] = balancedBag(allowedRanges, notesForClef);
        });

        rowClefs.forEach(rowClef => {
          for (let i = 0; i < ROW_SIZE; i += 1) {
            const rangeIndex = rangeBags[rowClef].pop();
            let noteName = noteBags[rowClef].pop();
            let key = `${rowClef}-${rangeIndex}-${noteName}`;

            if (key === lastKey) {
              const swapIndex = noteBags[rowClef].findIndex(candidate => candidate !== noteName);
              if (swapIndex >= 0) {
                [noteName, noteBags[rowClef][swapIndex]] = [noteBags[rowClef][swapIndex], noteName];
                key = `${rowClef}-${rangeIndex}-${noteName}`;
              }
            }

            const position = rangeStart[rowClef][rangeIndex] + NOTE_NAMES.indexOf(noteName);
            const item = { clef: rowClef, position, answer: noteName };
            lastKey = key;
            items.push(item);
          }
        });
        return items;
      }

      function quarterNoteMarkup(item, index, x) {
        const y = 112 - item.position * 9;
        const stemUp = item.position < 4;
        const isActive = index === currentIndex;
        const isDone = index < currentIndex;
        const color = isActive ? "#e8b44c" : isDone ? "#676b6e" : "#e8e7e2";
        const ledgerPositions = [];
        for (let position = -2; position >= item.position; position -= 2) ledgerPositions.push(position);
        for (let position = 10; position <= item.position; position += 2) ledgerPositions.push(position);
        const ledger = ledgerPositions
          .map(position => `<line x1="${x - 16}" y1="${112 - position * 9}" x2="${x + 16}" y2="${112 - position * 9}"></line>`)
          .join("");
        const stem = stemUp
          ? `<line x1="${x + 10}" y1="${y - 1}" x2="${x + 10}" y2="${y - 42}"></line>`
          : `<line x1="${x - 10}" y1="${y + 1}" x2="${x - 10}" y2="${y + 42}"></line>`;

        return `
          <g stroke="${color}" fill="${color}"${isDone ? ' opacity=".72"' : ""}>
            ${isActive ? `<rect x="${x - 22}" y="10" width="44" height="130" rx="12" fill="#e8b44c" opacity=".07" stroke="none"></rect>` : ""}
            <g fill="none" stroke-width="2" stroke-linecap="round">${ledger}</g>
            <ellipse cx="${x}" cy="${y}" rx="10" ry="7" transform="rotate(-18 ${x} ${y})"></ellipse>
            <g fill="none" stroke-width="3" stroke-linecap="round">${stem}</g>
          </g>`;
      }

      function scoreRowMarkup(items, rowStart) {
        const isTreble = items[0].clef === "treble";
        const isActiveRow = currentIndex >= rowStart && currentIndex < rowStart + ROW_SIZE;
        const noteX = [145, 210, 275, 340, 430, 495, 560, 625];
        const staffLines = [40, 58, 76, 94, 112]
          .map(y => `<line x1="12" y1="${y}" x2="710" y2="${y}"></line>`)
          .join("");
        const notes = items.map((item, offset) => quarterNoteMarkup(item, rowStart + offset, noteX[offset])).join("");

        return `
          <div class="score-row ${isActiveRow ? "active" : ""}" role="img" aria-label="${isTreble ? "Treble clef" : "Bass clef"}, two measures, notes ${rowStart + 1} through ${rowStart + items.length}${isActiveRow ? ", current row" : ""}">
            <svg viewBox="0 0 730 152" role="img" aria-hidden="true">
              <g stroke="#8e9296" stroke-width="1.5" stroke-linecap="round">${staffLines}</g>
              ${isTreble
                ? '<use href="#gClefShape" transform="translate(15 126) scale(.63)" fill="#e8e7e2"></use>'
                : `<use href="#fClefBodyShape" transform="translate(13 108.7) scale(.44)" fill="#e8e7e2"></use>
                   <circle cx="72" cy="49" r="5" fill="#e8e7e2"></circle>
                   <circle cx="72" cy="67" r="5" fill="#e8e7e2"></circle>`}
              <g fill="#e8e7e2" font-family="Georgia, serif" font-size="31" font-weight="700" text-anchor="middle">
                <text x="92" y="70">4</text><text x="92" y="105">4</text>
              </g>
              <g stroke="#8e9296" stroke-width="2">
                <line x1="385" y1="40" x2="385" y2="112"></line>
                <line x1="710" y1="40" x2="710" y2="112"></line>
              </g>
              ${notes}
            </svg>
          </div>`;
      }

      function renderNotePage(animate = false) {
        const pageStart = Math.floor(currentIndex / ROW_SIZE) * ROW_SIZE;
        const visibleNotes = round.slice(pageStart, pageStart + PAGE_SIZE);
        const rows = [];
        for (let offset = 0; offset < visibleNotes.length; offset += ROW_SIZE) {
          rows.push(scoreRowMarkup(visibleNotes.slice(offset, offset + ROW_SIZE), pageStart + offset));
        }
        noteGrid.innerHTML = rows.join("");
        positionElement.textContent = currentIndex + 1;
        stage.style.setProperty("--progress", `${currentIndex / round.length * 100}%`);
        updateSequence();
        if (animate) {
          noteGrid.animate(
            [{ opacity: .2, transform: "translateY(14px)" }, { opacity: 1, transform: "translateY(0)" }],
            { duration: 220, easing: "ease-out" }
          );
        }
      }

      function updateSequence() {
        [...sequenceElement.children].forEach((step, index) => {
          step.className = "step";
          if (index < currentIndex) step.classList.add("done");
          if (index === currentIndex && !finished) step.classList.add("current");
        });
      }

      function tick(now) {
        if (startTime !== null && !finished) {
          timeElement.textContent = ((now - startTime) / 1000).toFixed(2);
          timerFrame = requestAnimationFrame(tick);
        }
      }

      function startTimer() {
        if (startTime === null) {
          startTime = performance.now();
          timerFrame = requestAnimationFrame(tick);
        }
      }

      function flash(kind) {
        stage.classList.remove("flash-correct", "flash-wrong");
        void stage.offsetWidth;
        stage.classList.add(kind === "correct" ? "flash-correct" : "flash-wrong");
      }

      function handleAnswer(key) {
        if (finished || inputLocked || !NOTE_NAMES.includes(key)) return;
        startTimer();
        attempts += 1;

        const keyCap = document.querySelector(`[data-key="${key}"]`);
        keyCap.classList.add("pressed");
        setTimeout(() => keyCap.classList.remove("pressed"), 120);

        if (key === round[currentIndex].answer) {
          inputLocked = true;
          flash("correct");
          prompt.className = "prompt";
          prompt.textContent = "Correct";
          currentIndex += 1;

          if (currentIndex === round.length) {
            finishRound();
          } else {
            transitionTimer = setTimeout(() => {
              prompt.textContent = "Press the letter that matches the note";
              renderNotePage(currentIndex % ROW_SIZE === 0);
              inputLocked = false;
              transitionTimer = null;
            }, 110);
          }
        } else {
          errors += 1;
          errorElement.textContent = errors;
          prompt.className = "prompt error";
          prompt.textContent = `${key.toUpperCase()} is not correct — try again`;
          flash("wrong");
        }
      }

      function finishRound() {
        finished = true;
        cancelAnimationFrame(timerFrame);
        const elapsed = (performance.now() - startTime) / 1000;
        const accuracy = Math.round((round.length / attempts) * 100);
        timeElement.textContent = elapsed.toFixed(2);
        stage.style.setProperty("--progress", "100%");
        updateSequence();
        finalTimeElement.textContent = `${elapsed.toFixed(2)} s`;
        accuracyElement.textContent = `${accuracy}%`;
        finalErrorsElement.textContent = errors;
        practiceView.style.display = "none";
        resultView.style.display = "block";
        restartButton.focus();
      }

      function resetRound() {
        cancelAnimationFrame(timerFrame);
        clearTimeout(transitionTimer);
        transitionTimer = null;
        round = makeRound();
        currentIndex = 0;
        errors = 0;
        attempts = 0;
        startTime = null;
        finished = false;
        inputLocked = false;
        timeElement.textContent = "0.00";
        errorElement.textContent = "0";
        stage.classList.remove("flash-correct", "flash-wrong");
        prompt.className = "prompt";
        prompt.textContent = "Press the letter that matches the note";
        practiceView.style.display = "block";
        resultView.style.display = "none";
        roundLengthElement.textContent = round.length;
        sequenceElement.innerHTML = Array.from({length: round.length}, () => '<span class="step"></span>').join("");
        renderNotePage();
      }

      function updateSettings(setting, value) {
        settings[setting] = value;
        renderSettings();
        resetRound();
      }

      function renderSettings() {
        const clefLabel = settings.clef === "treble" ? "treble clef" : settings.clef === "bass" ? "bass clef" : "treble + bass";
        const rangeLabel = RANGE_LABELS[settings.clef][settings.range];
        const noteLabel = settings.notes.length === NOTE_NAMES.length
          ? "all notes"
          : settings.notes.map(note => note.toUpperCase()).join("");

        document.querySelectorAll(".option-button[data-setting]").forEach(button => {
          const selected = settings[button.dataset.setting] === button.dataset.value;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-pressed", String(selected));
        });

        document.querySelectorAll(".range-option").forEach(button => {
          button.textContent = RANGE_LABELS[settings.clef][button.dataset.value];
          const rangeName = button.dataset.value === "lower" ? "Lower range" : button.dataset.value === "upper" ? "Upper range" : "Both ranges";
          button.setAttribute("aria-label", `${rangeName}: ${button.textContent}`);
        });

        rowCountElement.textContent = settings.rows;
        rowDecreaseButton.disabled = settings.rows <= 1;
        rowIncreaseButton.disabled = settings.rows >= MAX_ROWS;
        document.querySelectorAll(".note-option").forEach(button => {
          const selected = settings.notes.includes(button.dataset.note);
          button.classList.toggle("active", selected);
          button.setAttribute("aria-pressed", String(selected));
          button.disabled = selected && settings.notes.length === 1;
        });
        roundLabel.textContent = `${settings.rows} ${settings.rows === 1 ? "row" : "rows"} · ${getRoundLength()} notes · ${clefLabel} · ${rangeLabel} · ${noteLabel}`;
      }

      function updateRowCount(delta) {
        settings.rows = Math.max(1, Math.min(MAX_ROWS, settings.rows + delta));
        renderSettings();
        resetRound();
      }

      function toggleNote(note) {
        if (settings.notes.includes(note)) {
          if (settings.notes.length === 1) return;
          settings.notes = settings.notes.filter(selectedNote => selectedNote !== note);
        } else {
          settings.notes = NOTE_NAMES.filter(candidate => candidate === note || settings.notes.includes(candidate));
        }
        renderSettings();
        resetRound();
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        const isUsingControl = event.target.closest?.("button") || event.target.closest?.("[role=group]");
        if (key === "tab" && !isUsingControl) {
          event.preventDefault();
          resetRound();
          return;
        }
        if (finished && (key === "enter" || key === " ")) {
          event.preventDefault();
          resetRound();
          return;
        }
        handleAnswer(key);
      });

      restartButton.addEventListener("click", resetRound);
      rowDecreaseButton.addEventListener("click", () => updateRowCount(-1));
      rowIncreaseButton.addEventListener("click", () => updateRowCount(1));
      document.querySelectorAll(".option-button[data-setting]").forEach(button => {
        button.addEventListener("click", () => updateSettings(button.dataset.setting, button.dataset.value));
      });
      document.querySelectorAll(".note-option").forEach(button => {
        button.addEventListener("click", () => toggleNote(button.dataset.note));
      });
      renderSettings();
      resetRound();
    })();
  </script>
</body>
</html>
